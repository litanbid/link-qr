name: Publish Docker image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_latest:
        description: Point latest at the existing image for the newest stable tag
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        if: ${{ !inputs.promote_latest }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check release version
        id: version
        if: ${{ !inputs.promote_latest }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo 'Release tag does not match package.json.'
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
        if: ${{ !inputs.promote_latest }}
      - run: npm test
        if: ${{ !inputs.promote_latest }}
      - uses: docker/setup-qemu-action@v4
        if: ${{ !inputs.promote_latest }}
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: ${{ !inputs.promote_latest }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
      - name: Promote newest stable tag to latest
        if: github.ref_type == 'tag' || inputs.promote_latest
        run: |
          git fetch --tags origin
          stable_tag="$(git tag --sort=-version:refname --list 'v*' |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !seen { print; seen=1 }')"
          if [ -z "$stable_tag" ]; then
            echo 'No stable release tag was found.'
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$stable_tag" ]; then
            echo "Leaving latest on the newest stable version ($stable_tag)."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${stable_tag#v}"
