services:
  link-qr:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LINK_QR_PORT:-3000}:3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
