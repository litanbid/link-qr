# Include this file in the nginx http block. Set the hostname, certificate paths
# and upstream to match the deployment. If behind another trusted proxy,
# configure nginx's real-IP handling before using the per-client limit.
limit_req_zone $binary_remote_addr zone=linkqr_generation:10m rate=30r/m;

server {
    listen 443 ssl;
    server_name qr.example.com;

    ssl_certificate /etc/letsencrypt/live/qr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.example.com/privkey.pem;

    location = /api/v1/qr {
        client_max_body_size 8k;
        limit_req zone=linkqr_generation burst=5 nodelay;
        limit_req_status 429;
        proxy_cache off;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
